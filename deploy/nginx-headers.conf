add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-+oaPpmEiVxNR8PMqJKkpbmIIpqPo7W+iDc6E6/Q2gT4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
